services:
  postgres:
    image: postgres:17-alpine
    container_name: bita-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: bita_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bita_data:/var/lib/postgresql/data

volumes:
  bita_data:
