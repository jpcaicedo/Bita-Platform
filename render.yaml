# Render Blueprint — https://render.com/docs/blueprint-spec
# Al crear el servicio con "New > Blueprint" Render lee este archivo.
# Las variables marcadas con `sync: false` se piden en el formulario de creación.
services:
  - type: web
    name: bita-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Mientras no existan migraciones, TypeORM crea el esquema.
      - key: DB_SYNC
        value: "true"
      # Neon exige SSL. Se usa rejectUnauthorized=false porque Neon no expone
      # un CA público estable para todos los clientes.
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      # Cadena de conexión *pooled* de Neon (la que termina en -pooler).
      - key: DATABASE_URL
        sync: false
      # Mínimo 64 caracteres (validado en AuthModule).
      - key: JWT_SECRET
        sync: false
